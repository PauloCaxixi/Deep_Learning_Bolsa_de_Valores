<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prediction result</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f152b, #1c345a);
      color: #fff;
      font-family: "Segoe UI", sans-serif;
    }
    .container {
      max-width: 980px;
      margin: 36px auto;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.45);
    }
    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    h1 { margin: 0; font-size: 22px; }
    .meta { opacity: 0.9; font-size: 14px; }
    .pred-box {
      background: rgba(255,255,255,0.09);
      padding: 12px 16px;
      border-radius: 10px;
      font-weight:700;
      color: #00ffcc;
      font-size: 20px;
    }
    canvas { width: 100% !important; height: 380px !important; display:block; }
    .back { margin-top: 14px; display:inline-block; color: #9ed8ff; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="top">
        <div>
          <h1>📊 Prediction for {{ symbol }}</h1>
          <div class="meta">Predicted for next day (horizon = 1)</div>
        </div>
        <div class="pred-box">
          {{ predictions[0] }}
        </div>
      </div>

      <div>
        <canvas id="historyChart"></canvas>
      </div>

      <div style="margin-top:12px;">
        <a class="back" href="/v1/">← Back to predictor</a>
      </div>
    </div>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // variables provided by Jinja: symbol, predictions
    const symbol = "{{ symbol }}";
    // parse Jinja output into JS (predictions is a list)
    const predicted = Number({{ predictions[0] }});

    // fetch history from backend and draw chart
    async function draw() {
      try {
        const resp = await fetch(`/v1/history?symbol=${encodeURIComponent(symbol)}&limit=90`);
        if (!resp.ok) {
          const e = await resp.json().catch(()=>({detail:resp.statusText}));
          console.error("History fetch error", e);
          return;
        }
        const data = await resp.json();
        // data.history is array of {date, close}
        const history = data.history || [];
        const labels = history.map(r => r.date);
        const closes = history.map(r => r.close);

        // add a future label for the predicted point
        const nextDate = (function() {
          // compute a next date label as last date + 1 day (simple)
          if (!labels.length) return "Next";
          const last = labels[labels.length - 1];
          try {
            const d = new Date(last);
            d.setDate(d.getDate() + 1);
            return d.toISOString().slice(0,10);
          } catch(e) {
            return "Next";
          }
        })();

        const labelsWithNext = labels.concat([nextDate]);
        const closesWithPred = closes.concat([predicted]);

        const ctx = document.getElementById('historyChart').getContext('2d');

        // gradient for line
        const gradient = ctx.createLinearGradient(0,0,0,400);
        gradient.addColorStop(0, 'rgba(39,164,255,0.25)');
        gradient.addColorStop(1, 'rgba(39,164,255,0.03)');

        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labelsWithNext,
            datasets: [
              {
                label: 'Close',
                data: closesWithPred,
                fill: true,
                backgroundColor: gradient,
                borderColor: '#27a4ff',
                borderWidth: 2,
                pointRadius: 3,
                pointBackgroundColor: '#27a4ff',
                tension: 0.2,
              },
              {
                label: 'Predicted',
                data: labelsWithNext.map((_,i) => i === labelsWithNext.length-1 ? closesWithPred[i] : null),
                borderColor: 'rgba(255,80,80,0.9)',
                backgroundColor: 'rgba(255,80,80,0.12)',
                pointRadius: 6,
                pointStyle: 'rectRot',
                showLine: false,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#e6f7ff' } },
              tooltip: { mode: 'index', intersect: false }
            },
            scales: {
              x: {
                ticks: { color: '#cfeeff' },
                grid: { color: 'rgba(255,255,255,0.03)' }
              },
              y: {
                ticks: { color: '#cfeeff' },
                grid: { color: 'rgba(255,255,255,0.03)' },
                beginAtZero: false
              }
            }
          }
        });

      } catch (err) {
        console.error("Error rendering chart", err);
      }
    }

    draw();
  </script>
</body>
</html>
